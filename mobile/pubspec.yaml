name: pharma_store_mobile
description: Hospital Management Platform Flutter client app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^12.0.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Networking & APIs
  dio: ^5.3.0

  # Caching & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Form inputs & validation
  reactive_forms: ^16.0.0

  # UI additions
  fl_chart: ^0.65.0
  table_calendar: ^3.0.9
  mobile_scanner: ^3.5.0
  pdf: ^3.10.7
  printing: ^5.11.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5

  # Firebase Integration
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.4

  # Code generation annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
